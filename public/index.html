<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMitra Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.9rem;
        }

        .status {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status.connected {
            background: #e8f5e8;
            color: #2d5a2d;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            color: #333;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 100px;
        }

        .btn:hover {
            background: #e9ecef;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .conversation {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            max-width: 80%;
        }

        .message.user {
            background: #e3f2fd;
            color: #333;
            margin-left: auto;
        }

        .message.assistant {
            background: #f1f1f1;
            color: #333;
        }

        .message.transcription {
            background: #fff3cd;
            color: #856404;
        }

        .message.chunk {
            background: #d1ecf1;
            color: #0c5460;
        }

        .message.streaming {
            background: #e8f5e8;
            color: #2d5a2d;
        }

        .timestamp {
            font-size: 0.7rem;
            color: #999;
            margin-top: 3px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            border: 2px solid #ddd;
            border-top: 2px solid #333;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border: 1px solid #f5c6cb;
            margin: 15px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CyberMitra Voice Assistant</h1>
            <p>Real-time voice conversation with AI</p>
        </div>

        <div id="status" class="status disconnected">
            Disconnected from server
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn">Connect</button>
            <button id="startBtn" class="btn" disabled>Start Voice</button>
            <button id="stopBtn" class="btn" disabled>Stop Voice</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing voice...</p>
        </div>

        <div id="error" class="error"></div>

        <div class="conversation" id="conversation">
            <div class="message assistant">
                <div>Hello! I'm your voice assistant. Click "Connect" to start, then "Start Voice" to begin speaking.</div>
                <div class="timestamp">Just now</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/voice.js"></script>
</body>
</html>
